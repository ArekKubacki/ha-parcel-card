name: Create v1.10.4 release

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/release-v1.10.4.yml"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate JavaScript syntax
        run: node --check parcel-card.js

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.10.4 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v1.10.4 already exists."
            exit 0
          fi

          gh release create v1.10.4 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "v1.10.4" \
            --notes "HA Parcel Card v1.10.4

          - Uses Allegro Buyer pickup_deadline as an automatic fallback.
          - Imports only unmatched: true rows as missing Do odbioru parcels.
          - Auto-detects the pickup-deadline sensor for the configured Allegro account.
          - Deduplicates fallback waybills against the normal Allegro order list."

          gh release upload v1.10.4 parcel-card.js \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
