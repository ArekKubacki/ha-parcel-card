name: Create v1.9.2 release

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/release-v1.9.2.yml"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate JavaScript syntax
        run: node --check parcel-card.js

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.9.2 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v1.9.2 already exists."
            exit 0
          fi

          gh release create v1.9.2 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "v1.9.2" \
            --notes "HA Parcel Card v1.9.2

          - Fixed missing pickup QR after Allegro + InPost merge.
          - Reconstructs InPost QR as P|phone|code when Allegro Buyer 0.3.0 returns pickup code and receiver phone without qr_code.
          - QR is no longer hidden by a stale merged IN_TRANSIT status.
          - AVAILABLE_FOR_PICKUP now wins over stale IN_TRANSIT during InPost + Allegro merge.
          - Preserves Allegro pickup metadata through carrier merges."

          gh release upload v1.9.2 parcel-card.js \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
