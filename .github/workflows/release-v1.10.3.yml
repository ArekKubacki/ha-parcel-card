name: Create v1.10.3 release

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/release-v1.10.3.yml"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate JavaScript syntax
        run: node --check parcel-card.js

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.10.3 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v1.10.3 already exists."
            exit 0
          fi

          gh release create v1.10.3 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "v1.10.3" \
            --notes "HA Parcel Card v1.10.3

          - Added Polish translation for Pick up your parcel / Collect your parcel.
          - Translates pickup deadline prefix until to do.
          - Allegro orders delivered by ORLEN to Allegro One Box / One Punkt are displayed under Allegro One.
          - ORLEN remains the physical carrier for exact tracking-number merging."

          gh release upload v1.10.3 parcel-card.js \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
