name: Create v1.9.1 release

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/release-v1.9.1.yml"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate JavaScript syntax
        run: node --check parcel-card.js

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.9.1 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v1.9.1 already exists."
            exit 0
          fi

          gh release create v1.9.1 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "v1.9.1" \
            --notes "HA Parcel Card v1.9.1

          - Added Polish translation of Allegro Buyer delivery messages.
          - Translates Parcel dispatched, Out for delivery, Ready for pickup, Delivered and related states.
          - Translates Estimated delivery to and similar prefixes.
          - Localizes compact English dates such as Tue Oct 27 to wt. 27 października.
          - Unknown delivery text is left unchanged."

          gh release upload v1.9.1 parcel-card.js \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
