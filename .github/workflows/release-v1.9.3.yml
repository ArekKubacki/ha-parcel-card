name: Create v1.9.3 release

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/release-v1.9.3.yml"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate JavaScript syntax
        run: node --check parcel-card.js

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.9.3 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v1.9.3 already exists."
            exit 0
          fi

          gh release create v1.9.3 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "v1.9.3" \
            --notes "HA Parcel Card v1.9.3

          - Added Polish translations for Allegro One / One Kurier delivery messages.
          - Translates Your parcel is on its way to point and related variants.
          - Canonical statuses such as IN_TRANSIT and AVAILABLE_FOR_PICKUP are now displayed using Polish labels.
          - Unknown delivery messages remain unchanged."

          gh release upload v1.9.3 parcel-card.js \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
